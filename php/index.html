<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Payments - HPP Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://globalpayments-samples.github.io/css/styles.css">
    <style>
        /* HPP-specific styles */
        .hpp-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .hpp-container {
            width: 100%;
            max-width: 500px;
        }
        #hppContainer {
            overflow: hidden;
            min-height: 500px;
        }
        #hppContainer iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
        .hpp-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: var(--gp-color-text-secondary, #666);
        }
        .hpp-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #262AFF;
            border-radius: 50%;
            animation: hpp-spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes hpp-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="gp-header">
        <div class="gp-container">
            <div class="gp-header-content">
                <div class="gp-logo">
                    <picture>
                        <source media="(min-width: 768px)" srcset="https://globalpayments-samples.github.io/assets/img/GP_logo.svg">
                        <img src="https://globalpayments-samples.github.io/assets/img/GP_favicon.svg" alt="Global Payments" style="height: 32px; width: auto;">
                    </picture>
                </div>
                <nav class="gp-header-nav">
                    <a href="../">3DS2 Testing</a>
                    <a href="https://developer.globalpayments.com/">Documentation</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="hpp-page">
        <div class="hpp-container">
            <!-- Order Summary -->
            <div class="gp-card" style="margin-bottom: 1rem;">
                <div class="gp-card-header">
                    <h2 class="gp-card-title">Order Summary</h2>
                </div>
                <div style="display: flex; justify-content: space-between; padding: 0.5rem 0;">
                    <span>Product</span>
                    <span>Test Item</span>
                </div>
                <div style="display: flex; justify-content: space-between; padding: 0.75rem 0; border-top: 1px solid #eee; margin-top: 0.5rem; font-weight: 600;">
                    <span>Total</span>
                    <span id="totalAmount">EUR 19.99</span>
                </div>
            </div>

            <!-- HPP Embedded Container -->
            <div class="gp-card" id="hppContainer">
                <div class="hpp-loading" id="loadingIndicator">
                    <div class="hpp-spinner"></div>
                    <p>Loading secure payment form...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="gp-footer">
        <div class="gp-container">
            <div class="gp-footer-content">
                <p class="gp-footer-copyright">&copy; 2026 Global Payments. HPP Checkout.</p>
            </div>
        </div>
    </footer>

    <!-- jQuery and rxp-hpp.js -->
    <script src="https://code.jquery.com/jquery-3.5.0.js"></script>
    <script src="https://pay.sandbox.realexpayments.com/pay/js/rxp-hpp.js"></script>
    <script>
        $(document).ready(function() {
            loadHPP();
        });

        function loadHPP() {
            $.getJSON("api/hpp-request.php", {
                amount: "19.99",
                currency: "EUR",
                name: "John Doe",
                email: "customer@example.com"
            }, function(hppJson) {
                console.log("HPP JSON:", hppJson);

                if (hppJson.error) {
                    showError(hppJson.message);
                    return;
                }

                $("#loadingIndicator").hide();

                RealexHpp.setHppUrl("https://pay.sandbox.realexpayments.com/pay");

                RealexHpp.embedded.init(
                    "autoload",
                    "hppContainer",
                    "api/hpp-response.php",
                    hppJson
                );

                window.addEventListener('message', receiveMessage, false);

            }).fail(function(jqXHR, textStatus, error) {
                showError("Failed to load payment form: " + textStatus);
            });
        }

        function showError(message) {
            $("#hppContainer").html(
                '<div class="gp-alert gp-alert-error" style="margin: 2rem;">' +
                '<strong>Error</strong><br>' + message +
                '</div>'
            );
        }

        function receiveMessage(event) {
            let response = event.data;
            if (typeof response === 'string') {
                try {
                    response = JSON.parse(response);
                } catch (e) {
                    return;
                }
            }

            if (response && response.RESULT !== undefined) {
                console.log("Payment Response:", response);

                if (response.RESULT === '00') {
                    $("#hppContainer").html(
                        '<div class="gp-alert gp-alert-success" style="margin: 2rem; text-align: center;">' +
                        '<strong>Payment Successful!</strong><br>' +
                        'Order ID: ' + (response.ORDER_ID || 'N/A') + '<br>' +
                        'Auth Code: ' + (response.AUTHCODE || 'N/A') +
                        '</div>'
                    );
                } else {
                    $("#hppContainer").html(
                        '<div class="gp-alert gp-alert-error" style="margin: 2rem; text-align: center;">' +
                        '<strong>Payment Failed</strong><br>' +
                        (response.MESSAGE || 'An error occurred') +
                        '</div>'
                    );
                }
            }
        }
    </script>
</body>
</html>
