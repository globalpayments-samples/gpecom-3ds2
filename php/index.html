<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Payments - Checkout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .checkout-container {
            width: 100%;
            max-width: 500px;
        }
        .order-summary {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .order-summary h2 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 1rem;
        }
        .order-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
        }
        .order-total {
            border-top: 1px solid #eee;
            margin-top: 0.5rem;
            padding-top: 0.75rem;
            font-weight: 600;
        }

        /* HPP iframe container */
        #hppContainer {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            min-height: 500px;
        }
        #hppContainer iframe {
            width: 100%;
            height: 500px;
            border: none;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: #666;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #00263e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            padding: 2rem;
            text-align: center;
            color: #721c24;
            background: #f8d7da;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <!-- Order Summary -->
        <div class="order-summary">
            <h2>Order Summary</h2>
            <div class="order-row">
                <span>Product</span>
                <span>Test Item</span>
            </div>
            <div class="order-row order-total">
                <span>Total</span>
                <span id="totalAmount">EUR 19.99</span>
            </div>
        </div>

        <!-- HPP Embedded Container -->
        <div id="hppContainer">
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Loading secure payment form...</p>
            </div>
        </div>
    </div>

    <!-- jQuery and rxp-hpp.js -->
    <script src="https://code.jquery.com/jquery-3.5.0.js"></script>
    <script src="https://pay.sandbox.realexpayments.com/pay/js/rxp-hpp.js"></script>
    <script>
        $(document).ready(function() {
            // Auto-load the HPP on page load
            loadHPP();
        });

        function loadHPP() {
            // Get HPP JSON from server
            $.getJSON("api/hpp-request.php", {
                amount: "19.99",
                currency: "EUR",
                name: "John Doe",
                email: "customer@example.com"
            }, function(hppJson) {
                console.log("HPP JSON:", hppJson);

                if (hppJson.error) {
                    showError(hppJson.message);
                    return;
                }

                // Hide loading indicator
                $("#loadingIndicator").hide();

                // Set HPP URL
                RealexHpp.setHppUrl("https://pay.sandbox.realexpayments.com/pay");

                // Initialize embedded HPP - this loads the Global Payments payment form
                RealexHpp.embedded.init(
                    "autoload",           // Auto-load immediately
                    "hppContainer",       // Container element ID
                    "api/hpp-response.php", // Response endpoint
                    hppJson               // HPP JSON from server
                );

                // Listen for response
                window.addEventListener('message', receiveMessage, false);

            }).fail(function(jqXHR, textStatus, error) {
                showError("Failed to load payment form: " + textStatus);
            });
        }

        function showError(message) {
            $("#hppContainer").html('<div class="error"><h3>Error</h3><p>' + message + '</p></div>');
        }

        function receiveMessage(event) {
            let response = event.data;
            if (typeof response === 'string') {
                try {
                    response = JSON.parse(response);
                } catch (e) {
                    return;
                }
            }

            if (response && response.RESULT !== undefined) {
                console.log("Payment Response:", response);

                if (response.RESULT === '00') {
                    $("#hppContainer").html(`
                        <div style="padding: 2rem; text-align: center; background: #d4edda; color: #155724;">
                            <h3>Payment Successful!</h3>
                            <p>Order ID: ${response.ORDER_ID || 'N/A'}</p>
                            <p>Auth Code: ${response.AUTHCODE || 'N/A'}</p>
                        </div>
                    `);
                } else {
                    $("#hppContainer").html(`
                        <div style="padding: 2rem; text-align: center; background: #f8d7da; color: #721c24;">
                            <h3>Payment Failed</h3>
                            <p>${response.MESSAGE || 'An error occurred'}</p>
                        </div>
                    `);
                }
            }
        }
    </script>
</body>
</html>
